name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_choice:
        description: "Bump applied to build inputs before checks (Major = middle+1 & reset last, minor = last+1, retry = keep)"
        type: choice
        default: retry
        options: [Major, minor, retry]

permissions:
  contents: write

env:
  REPO_NAME: Vaudville-Configurator

jobs:
  gate:
    runs-on: linux-amd64
    outputs:
      version: ${{ steps.calc.outputs.version }}
      publish: ${{ steps.calc.outputs.publish }}
      bump: ${{ steps.calc.outputs.bump }}
      notes: ${{ steps.calc.outputs.notes }}
      release_id: ${{ steps.rel.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: calc
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ github.event.inputs.version_choice }}
        run: |
          set -euo pipefail
          cur="$(cat VERSION)"
          IFS=. read -r a b c <<< "$cur"
          choice="$CHOICE"
          [ "$EVENT" = "workflow_dispatch" ] || choice=retry
          case "$choice" in
            Major) new="$a.$((b + 1)).0"; bump=true ;;
            minor) new="$a.$b.$((c + 1))"; bump=true ;;
            retry) new="$cur";          bump=false ;;
            *) echo "unknown version_choice: $choice" >&2; exit 2 ;;
          esac
          if [ "$EVENT" = "push" ]; then
            # automatic publication only when the application version changed
            if git rev-parse -q --verify "refs/tags/v$new" >/dev/null; then publish=false; else publish=true; fi
          else
            publish=true
          fi
          prev="$(git tag -l 'v*' | sort -V | tail -n 1 || true)"
          if [ -n "$prev" ]; then notes="$(git log --pretty=%s -n 10 "$prev..HEAD")"
          else notes="$(git log --pretty=%s -n 10)"; fi
          [ -n "$notes" ] || notes="no changes since previous release"
          {
            echo "version=$new"
            echo "publish=$publish"
            echo "bump=$bump"
            echo "notes=$(printf '%s' "$notes" | base64 -w 0)"
          } >> "$GITHUB_OUTPUT"
          echo "### version=$new publish=$publish bump=$bump choice=$choice prev=${prev:-none}"
      - id: rel
        if: steps.calc.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.AUTH_TOKEN || secrets.GITHUB_TOKEN }}
          VER: ${{ steps.calc.outputs.version }}
          NOTES_B64: ${{ steps.calc.outputs.notes }}
        run: |
          set -euo pipefail
          api="${{ github.server_url }}/api/v1"
          repo="${{ github.repository }}"
          auth="Authorization: token $TOKEN"
          tag="v$VER"
          host="${{ github.server_url }}"; host="${host#https://}"
          ls_out="$(git ls-remote "https://x-access-token:$TOKEN@$host/$repo.git" "refs/tags/$tag" || true)"
          tag_sha="${ls_out%%$'\t'*}"
          rel="$(curl -sf -H "$auth" "$api/repos/$repo/releases/tags/$tag" || true)"
          if [ -n "$rel" ]; then
            id="$(printf '%s' "$rel" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "${{ github.sha }}" ]; then
              echo "tag $tag belongs to $tag_sha, not ${{ github.sha }}; refusing to overwrite" >&2
              exit 1
            fi
            echo "### reusing existing release $id for tag $tag (retry): clearing its assets"
            printf '%s' "$rel" | python3 -c '
          import json, sys
          for a in json.load(sys.stdin)["assets"]:
              print(a["id"])
          ' | while read -r aid; do
              curl -sf -X DELETE -H "$auth" "$api/repos/$repo/releases/$id/assets/$aid" >/dev/null || true
            done
          else
            notes="$(printf '%s' "$NOTES_B64" | base64 -d)"
            body="$(printf '%s\n' "$notes" | sed 's/^/* /')"
            payload="$(python3 -c 'import json,sys; t,s,n,b=sys.argv[1:5]; print(json.dumps({"tag_name":t,"target_commitish":s,"name":n,"body":b}))' "$tag" "${{ github.sha }}" "${REPO_NAME} v$VER" "$body")"
            rel="$(curl -sf -X POST -H "$auth" -H 'Content-Type: application/json' -d "$payload" "$api/repos/$repo/releases")"
            id="$(printf '%s' "$rel" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
            echo "### created release $id for tag $tag"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4
      - name: prepare build container (libpython + tkinter for PyInstaller/GUI)
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            ver="$(python3 -c 'import sys; print(f"{sys.version_info[0]}.{sys.version_info[1]}")')"
            apt-get update -qq >/dev/null 2>&1 || true
            apt-get install -y -qq "libpython${ver}" "python3-tk" >/dev/null 2>&1 \
              || echo "### apt could not install libpython${ver}/python3-tk; continuing anyway"
          fi
      - name: apply version bump to build inputs
        if: needs.gate.outputs.bump == 'true'
        run: python3 tools/bump_version.py "${{ needs.gate.outputs.version }}"
      - name: checks
        run: |
          set -euo pipefail
          python3 -c "import tkinter; print('tkinter OK')"
          python3 vaudville_configurator.py --selftest --ci
          bash -n tests/run_e2e_test.sh tests/run_direct_llama_test.sh \
                  tests/run_real_backend_test.sh tools/build_package.sh
          if command -v Xvfb >/dev/null 2>&1; then
            Xvfb :99 -screen 0 1400x1000x24 -nolisten tcp & XPID=$!
            sleep 1
            DISPLAY=:99 python3 vaudville_configurator.py --gui-check
            kill "$XPID"
          else
            echo "### Xvfb unavailable; skipping --gui-check"
          fi
      - name: build single-file binary
        run: bash tools/build_package.sh
      - name: package and upload to the release
        env:
          TOKEN: ${{ secrets.AUTH_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.gate.outputs.release_id }}
        run: |
          set -euo pipefail
          v="${{ needs.gate.outputs.version }}"
          name="${REPO_NAME}.v${v}-linux-amd64.tar.gz"
          mkdir -p pkg
          cp dist/vaudville-configurator README.md VERSION pkg/
          tar czf "$name" -C pkg .
          sha256sum "$name"
          curl -sf -H "Authorization: token $TOKEN" -F "attachment=@${name};filename=${name}" \
               "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" >/dev/null
          echo "### uploaded $name to release $RELEASE_ID"

  build-windows:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: probe runner environment
        id: probe
        shell: bash
        run: |
          os="$(uname -s 2>/dev/null || echo unknown)"
          case "$os" in
            MINGW*|MSYS*|CYGWIN*|Windows*) real=true ;;
            *) real=false ;;
          esac
          echo "uname=$os real_windows=$real wine=$(command -v wine64 wine 2>/dev/null | head -n1 || true)"
          echo "real_windows=$real" >> "$GITHUB_OUTPUT"
      - name: apply version bump to build inputs
        if: needs.gate.outputs.bump == 'true'
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then python3 tools/bump_version.py "${{ needs.gate.outputs.version }}"
          else python tools/bump_version.py "${{ needs.gate.outputs.version }}"; fi
      - name: checks
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then python3 vaudville_configurator.py --selftest --ci
          else python vaudville_configurator.py --selftest --ci; fi
      - name: build single-file exe (real Windows only)
        if: steps.probe.outputs.real_windows == 'true'
        shell: bash
        run: |
          if command -v py >/dev/null 2>&1; then PY="py -3"; else PY="python"; fi
          if [ ! -x .venv-build/Scripts/pyinstaller.exe ]; then
            $PY -m venv .venv-build
            .venv-build/Scripts/python -m pip install --upgrade pip
            .venv-build/Scripts/python -m pip install pyinstaller
          fi
          .venv-build/Scripts/pyinstaller --onefile --clean --name VaudvilleConfigurator vaudville_configurator.py
      - name: package exe
        if: steps.probe.outputs.real_windows == 'true'
        shell: bash
        run: |
          v="${{ needs.gate.outputs.version }}"
          echo "NAME=${REPO_NAME}.v${v}-windows-x86_64.zip" >> "$GITHUB_ENV"
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          $PY -m zipfile -c "${REPO_NAME}.v${v}-windows-x86_64.zip" dist/VaudvilleConfigurator.exe README.md VERSION
      - name: packaged-source fallback (no real Windows runner)
        if: steps.probe.outputs.real_windows == 'false' && vars.ALLOW_WINDOWS_SOURCE_FALLBACK == 'true'
        shell: bash
        run: |
          v="${{ needs.gate.outputs.version }}"
          echo "NAME=${REPO_NAME}.v${v}-windows-x86_64-source.zip" >> "$GITHUB_ENV"
          echo "### no real Windows runner on this label: packaging interpreted source (output family F3)"
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          $PY -m zipfile -c "${REPO_NAME}.v${v}-windows-x86_64-source.zip" vaudville_configurator.py VERSION README.md tools tests
      - name: refuse without a real Windows runner
        if: steps.probe.outputs.real_windows == 'false' && vars.ALLOW_WINDOWS_SOURCE_FALLBACK != 'true'
        shell: bash
        run: |
          echo "ERROR: the windows-x86_64 label was served by a Linux runner ($(uname -s))." >&2
          echo "PyInstaller cannot cross-compile a Windows exe on Linux. Either register" >&2
          echo "act_runner on a Windows host (VLM_RUNNER_TOKEN=*** tools/register_runner.sh windows)" >&2
          echo "and remove the windows-* labels from the Linux runners, or set the repository" >&2
          echo "variable ALLOW_WINDOWS_SOURCE_FALLBACK=true to publish the F3 packaged-source" >&2
          echo "zip for Windows until a real Windows runner exists." >&2
          exit 1
      - name: upload to the release
        env:
          TOKEN: ${{ secrets.AUTH_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.gate.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: token $TOKEN" -F "attachment=@${NAME};filename=${NAME}" \
               "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" >/dev/null
          echo "### uploaded $NAME to release $RELEASE_ID"

  publish:
    needs: [gate, build-linux, build-windows]
    if: needs.gate.outputs.publish == 'true'
    runs-on: linux-amd64
    env:
      TOKEN: ${{ secrets.AUTH_TOKEN || secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.gate.outputs.release_id }}
    steps:
      - name: verify the published release
        run: |
          set -euo pipefail
          api="${{ github.server_url }}/api/v1"
          repo="${{ github.repository }}"
          rel="$(curl -sf -H "Authorization: token $TOKEN" "$api/repos/$repo/releases/${RELEASE_ID}")"
          printf '%s' "$rel" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print("release:", d["id"], d["tag_name"], "-", d["name"])
          names = []
          for a in d["assets"]:
              print("  asset:", a["name"], a["size"], "bytes")
              names.append(a["name"])
          need = ("-linux-amd64.tar.gz", "-windows-x86_64")
          if len(names) < 2 or not any(n.endswith(need[0]) for n in names) \
             or not any(need[1] in n for n in names):
              sys.exit(f"release assets incomplete: {names}")
          print("### release verified:", d["html_url"])
          '

  bump-commit:
    needs: [gate, publish]
    if: needs.gate.outputs.bump == 'true'
    runs-on: linux-amd64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: commit version bump after successful publication
        env:
          TOKEN: ${{ secrets.AUTH_TOKEN || secrets.GITHUB_TOKEN }}
          VER: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/bump_version.py "$VER"
          git config user.name "Vaudville Release Bot"
          git config user.email "killbot-prime@phrk.org"
          git add VERSION vaudville_configurator.py
          msg="chore(release): bump version to $VER

          - VERSION and APP_VERSION synchronised after the v$VER release published.

          ~ Midnight Phreaker ~ <midnightphreaker@gmail.com>"
          git commit -m "$msg"
          host="${{ github.server_url }}"; host="${host#https://}"
          git push "https://x-access-token:$TOKEN@$host/${{ github.repository }}.git" \
              HEAD:refs/heads/main
